<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:#f8f8f6;font-family:Inter,system-ui,sans-serif;color:#242136}body{overflow-x:hidden}.authPage{min-height:100svh;height:100svh;width:100%;max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(360px,480px) minmax(0,1fr);gap:clamp(36px,4.5vw,72px);padding:24px clamp(24px,4vw,64px);overflow:hidden}.authCard{width:min(480px,100%);padding:30px 38px 27px;border:1px solid #e9e7ed;border-radius:22px;background:#fff}.authCard h1{font-size:34px}.authStory{padding:0;min-width:0;min-height:0;align-self:stretch;display:flex;justify-content:center;align-items:center;overflow:visible}.networkScene{position:relative;width:100%;max-width:760px;height:540px;min-height:540px;margin:0 auto;overflow:visible}.authStoryHeadline{position:absolute;left:50%;top:50%;width:min(560px,74%);max-width:560px;margin:0;transform:translate(-50%,-50%);text-align:center;z-index:10}.authStoryHeadline strong{display:block;font-size:clamp(34px,3.05vw,44px);line-height:1.06;letter-spacing:-.06em}.authStoryHeadline em{font-style:normal;color:#7154e6}.networkNode{position:absolute;z-index:12;width:104px;height:88px;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translate(-50%,-50%)}.nodeIcon{width:60px;height:60px;border-radius:50%;border:6px solid rgba(255,255,255,.96);display:grid;place-items:center;font-size:15px;font-weight:850;box-shadow:0 9px 24px rgba(48,40,78,.10),0 0 0 1px rgba(216,211,229,.78);animation:signalProfileFloat 4.2s ease-in-out infinite}.networkNode b{font-size:11px;line-height:1.15;white-space:nowrap;animation:signalLabelFloat 4.2s ease-in-out infinite}.nodeOne{left:16%;top:23%}.nodeTwo{left:84%;top:23%}.nodeThree{left:84%;top:77%}.nodeFour{left:16%;top:77%}.nodeOne .nodeIcon{background:#eee7ff;color:#6752c7}.nodeTwo .nodeIcon{background:#eaf7f1;color:#418a6c}.nodeThree .nodeIcon{background:#fff1ed;color:#b56559}.nodeFour .nodeIcon{background:#eaf1ff;color:#4e6fa8}.nodeOne b{color:#6653b7}.no
